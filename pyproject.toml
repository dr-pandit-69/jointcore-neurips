[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "jointcore-camera-ready"
version = "1.0.0"
description = "Reproducible implementation of JointCore memory sufficiency experiments."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
gpu = [
    "accelerate==1.3.0",
    "bitsandbytes==0.50.2",
    "safetensors==0.8.0",
    "torch==2.6.0",
    "transformers==5.15.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
